name: hanse

x-hanse-image: &hanse-image
  image: ${HANSE_IMAGE:-ghcr.io/arkaneman/hanse}:${HANSE_TAG:-latest}

services:
  hanse:
    <<: *hanse-image
    container_name: hanse
    restart: unless-stopped
    user: "1000:1000"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      HANSE_OPERATOR_TOKEN: ${HANSE_OPERATOR_TOKEN:?set HANSE_OPERATOR_TOKEN in .env}
      HANSE_SHUTDOWN_GRACE_MS: ${HANSE_SHUTDOWN_GRACE_MS:-25000}
      HANSE_START_DRAINED: ${HANSE_START_DRAINED:-0}
      HANSE_RUNTIME_TOKEN: ${HANSE_RUNTIME_TOKEN:?set HANSE_RUNTIME_TOKEN in .env}
      HANSE_STATE_HOME: /data/state
      HANSE_AGENTS_HOME: /data/agents
      HANSE_RUNNER_URL: http://runner:8790
      HANSE_HOST_WORKSPACE: ${HANSE_HOST_WORKSPACE:?set HANSE_HOST_WORKSPACE to the absolute host workspace path}
      HANSE_HOST_AGENTS: ${HANSE_HOST_AGENTS:?set HANSE_HOST_AGENTS to the absolute host agents path}
      HANSE_HOST_MOUNTS: ${HANSE_HOST_MOUNTS:?set HANSE_HOST_MOUNTS to the absolute host mounts path}
      HANSE_AGENT_API_BASE: http://hanse:8787
      HANSE_DEPLOY_LOCK_FILE: ${HANSE_DEPLOY_LOCK_FILE:-/data/state/hanse/deploy.lock}
      HANSE_AGENT_IMAGE: ${HANSE_AGENT_IMAGE:-ghcr.io/arkaneman/hanse-agent-default}:${HANSE_AGENT_TAG:-${HANSE_TAG:-latest}}
      HANSE_AGENT_BASE_IMAGE: ${HANSE_AGENT_BASE_IMAGE:-ghcr.io/arkaneman/hanse-agent-base:${HANSE_AGENT_TAG:-${HANSE_TAG:-latest}}}
      HANSE_AGENT_AUTO_STOP_MS: ${HANSE_AGENT_AUTO_STOP_MS:-172800000}
      HANSE_AGENT_AUTO_UPDATE_MS: ${HANSE_AGENT_AUTO_UPDATE_MS:-10800000}
      HANSE_AGENT_MAINTENANCE_INTERVAL_MS: ${HANSE_AGENT_MAINTENANCE_INTERVAL_MS:-300000}
      HANSE_AGENT_AUTO_PULL_MS: ${HANSE_AGENT_AUTO_PULL_MS:-900000}
      HANSE_IDE_URL: /ide/
      HANSE_IDE: "0"
      HANSE_IDE_HOST: ide
      HANSE_IDE_PORT: "8080"
    ports:
      - "${HANSE_BIND:-127.0.0.1}:${HANSE_PORT:-8787}:8787"
    volumes:
      - ${HANSE_WORKSPACE:-./workspace}:/data/workspace
      - ${HANSE_STATE:-./state}:/data/state
      - ${HANSE_AGENTS:-./agents}:/data/agents
      - ${HANSE_HOST_MOUNTS:?set HANSE_HOST_MOUNTS to the absolute host mounts path}:${HANSE_HOST_MOUNTS:?set HANSE_HOST_MOUNTS to the absolute host mounts path}
    networks:
      - front
      - control
    depends_on:
      runner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ide:
    image: ${HANSE_IDE_IMAGE:-ghcr.io/arkaneman/hanse-agent-ide}:${HANSE_IDE_TAG:-${HANSE_AGENT_TAG:-${HANSE_TAG:-latest}}}
    container_name: hanse-ide
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    command:
      - /usr/lib/code-server/bin/code-server
      - --auth
      - none
      - --bind-addr
      - 0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check
      - --extensions-dir
      - /opt/hanse-ext
      - --user-data-dir
      - /home/coder/.config/code-server
      - /data/workspace
    environment:
      HANSE_API_BASE: http://hanse:8787
      HANSE_OPERATOR_TOKEN: ${HANSE_OPERATOR_TOKEN:?set HANSE_OPERATOR_TOKEN in .env}
    volumes:
      - ${HANSE_WORKSPACE:-./workspace}:/data/workspace
    networks:
      - front
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      hanse:
        condition: service_healthy

  runner:
    image: ${HANSE_RUNNER_IMAGE:-ghcr.io/arkaneman/hanse-runner}:${HANSE_RUNNER_TAG:-${HANSE_AGENT_TAG:-${HANSE_TAG:-latest}}}
    container_name: hanse-runner
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    # CHOWN is needed by git Test connection credential writes. DAC_OVERRIDE is needed because the
    # runner runs as root and must read per-app 0600 uid-1000 state (opencode password, credentials)
    # from read-only binds; without it those reads fail. No other capability is granted.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    cpus: 2.0
    environment:
      HANSE_RUNTIME_TOKEN: ${HANSE_RUNTIME_TOKEN:?set HANSE_RUNTIME_TOKEN in .env}
      HANSE_HOST_WORKSPACE: ${HANSE_HOST_WORKSPACE:?set HANSE_HOST_WORKSPACE to the absolute host workspace path}
      HANSE_HOST_AGENTS: ${HANSE_HOST_AGENTS:?set HANSE_HOST_AGENTS to the absolute host agents path}
      HANSE_HOST_MOUNTS: ${HANSE_HOST_MOUNTS:?set HANSE_HOST_MOUNTS to the absolute host mounts path}
      HANSE_AGENT_IMAGE: ${HANSE_AGENT_IMAGE:-ghcr.io/arkaneman/hanse-agent-default}:${HANSE_AGENT_TAG:-${HANSE_TAG:-latest}}
      HANSE_AGENT_BASE_IMAGE: ${HANSE_AGENT_BASE_IMAGE:-ghcr.io/arkaneman/hanse-agent-base:${HANSE_AGENT_TAG:-${HANSE_TAG:-latest}}}
      HANSE_DOCKER_DATA_ROOT: ${HANSE_DOCKER_DATA_ROOT:-/var/lib/docker}
      HANSE_PULL_MAX_BYTES: ${HANSE_PULL_MAX_BYTES:-}
      HANSE_COORDINATOR_CONTAINER: hanse
      HANSE_DOCKER_SOCKET: /var/run/docker.sock
      HANSE_HOST_RUNNER_TMP: ${HANSE_HOST_RUNNER_TMP:-/var/lib/hanse/tmp}
      HANSE_BUILD_RECORDS_DIR: ${HANSE_BUILD_RECORDS_DIR:-/var/lib/hanse/builds}
      HANSE_APP_MEMORY_MAX_MB: ${HANSE_APP_MEMORY_MAX_MB:-}
      HANSE_APP_CPUS_MAX: ${HANSE_APP_CPUS_MAX:-}
      HANSE_APP_PIDS_MAX: ${HANSE_APP_PIDS_MAX:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HANSE_HOST_WORKSPACE:?set HANSE_HOST_WORKSPACE to the absolute host workspace path}:${HANSE_HOST_WORKSPACE:?set HANSE_HOST_WORKSPACE to the absolute host workspace path}:ro
      - ${HANSE_HOST_AGENTS:?set HANSE_HOST_AGENTS to the absolute host agents path}:${HANSE_HOST_AGENTS:?set HANSE_HOST_AGENTS to the absolute host agents path}:ro
      - ${HANSE_HOST_MOUNTS:?set HANSE_HOST_MOUNTS to the absolute host mounts path}:${HANSE_HOST_MOUNTS:?set HANSE_HOST_MOUNTS to the absolute host mounts path}:ro
      - ${HANSE_HOST_RUNNER_TMP:-/var/lib/hanse/tmp}:${HANSE_HOST_RUNNER_TMP:-/var/lib/hanse/tmp}
      - ${HANSE_BUILD_RECORDS_DIR:-/var/lib/hanse/builds}:${HANSE_BUILD_RECORDS_DIR:-/var/lib/hanse/builds}
      - ${HANSE_DOCKER_DATA_ROOT:-/var/lib/docker}:${HANSE_DOCKER_DATA_ROOT:-/var/lib/docker}:ro
    networks:
      - control
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  front:
  control:
