# Source-build overlay. Use it with the release compose file:
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# The resulting images are local (defaults: hanse:dev, hanse-agent-ide:dev,
# hanse-runner:dev) and do not overwrite the published tags. The per-app agent image is not a
# Compose service, so this overlay does not build agent-default; build it explicitly with
# `docker build --target agent-default -t hanse-agent-default:dev .` when needed.
services:
  hanse:
    image: ${HANSE_BUILD_IMAGE:-hanse:dev}
    build:
      context: .
      target: runtime

  ide:
    image: ${HANSE_IDE_BUILD_IMAGE:-hanse-agent-ide:dev}
    build:
      context: .
      target: agent-ide

  runner:
    image: ${HANSE_RUNNER_BUILD_IMAGE:-hanse-runner:dev}
    build:
      context: .
      target: runner
