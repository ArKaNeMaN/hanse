# Source-build overlay. Use it with the release compose file:
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# The resulting images are local (defaults: hanse:dev, hanse-agent-ide:dev,
# hanse-agent-default:dev) and do not overwrite the published tags.
services:
  hanse:
    image: ${HANSE_BUILD_IMAGE:-hanse:dev}
    build:
      context: .
      target: runtime

  ide:
    image: ${HANSE_IDE_BUILD_IMAGE:-hanse-agent-ide:dev}
    build:
      context: .
      target: agent-ide

  agents:
    image: ${HANSE_AGENT_BUILD_IMAGE:-hanse-agent-default:dev}
    build:
      context: .
      target: agent-default
