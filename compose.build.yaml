# Source-build overlay. Use it with the release compose file:
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# The resulting image is local (default: hanse:dev) and does not overwrite the published tag.
services:
  hanse:
    image: ${HANSE_BUILD_IMAGE:-hanse:dev}
    build:
      context: .
      target: runtime

  ide:
    image: ${HANSE_BUILD_IMAGE:-hanse:dev}
    build:
      context: .
      target: runtime
