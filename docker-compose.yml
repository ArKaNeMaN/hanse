services:
  hanse:
    build: .
    image: hanse:0.1.0
    container_name: hanse
    restart: unless-stopped
    environment:
      HANSE_OPERATOR_TOKEN: ${HANSE_OPERATOR_TOKEN:?set HANSE_OPERATOR_TOKEN in .env}
      HANSE_STATE_HOME: /data/state
      HANSE_AUTH_FILE: /run/hanse/auth.json
    ports:
      - "<LAN_HOST>:8787:8787"
    volumes:
      - ./workspace:/data/workspace
      - hanse-state:/data/state
      - ${HOME}/.local/share/opencode/auth.json:/run/hanse/auth.json:ro

  ide:
    image: codercom/code-server:latest
    container_name: hanse-ide
    restart: unless-stopped
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:?set CODE_SERVER_PASSWORD in .env}
    ports:
      - "<LAN_HOST>:8444:8080"
    volumes:
      - ./workspace:/home/coder/workspace

volumes:
  hanse-state:
