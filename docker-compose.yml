services:
  hanse:
    build: .
    image: hanse:0.1.0
    container_name: hanse
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HANSE_OPERATOR_TOKEN: ${HANSE_OPERATOR_TOKEN:?set HANSE_OPERATOR_TOKEN in .env}
      HANSE_STATE_HOME: /data/state
      HANSE_AUTH_FILE: /run/hanse/auth.json
      HANSE_IDE_URL: /ide/
      HANSE_IDE: "0"
      HANSE_IDE_HOST: ide
      HANSE_IDE_PORT: "8080"
    ports:
      - "<LAN_HOST>:8787:8787"
    volumes:
      - ./workspace:/data/workspace
      - ./state:/data/state
      - ${HOME}/.local/share/opencode/auth.json:/run/hanse/auth.json:ro

  ide:
    image: hanse:0.1.0
    container_name: hanse-ide
    restart: unless-stopped
    user: "1000:1000"
    command:
      - /usr/lib/code-server/bin/code-server
      - --auth
      - none
      - --bind-addr
      - 0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check
      - --extensions-dir
      - /opt/hanse-ext
      - --user-data-dir
      - /home/node/.config/code-server
      - /data/workspace
    environment:
      HANSE_API_BASE: http://hanse:8787
      HANSE_OPERATOR_TOKEN: ${HANSE_OPERATOR_TOKEN:?set HANSE_OPERATOR_TOKEN in .env}
    volumes:
      - ./workspace:/data/workspace
