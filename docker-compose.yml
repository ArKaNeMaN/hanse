services:
  hanse:
    build: .
    image: hanse:0.1.0
    container_name: hanse
    restart: unless-stopped
    environment:
      HANSE_OPERATOR_TOKEN: ${HANSE_OPERATOR_TOKEN:?set HANSE_OPERATOR_TOKEN in .env}
      HANSE_STATE_HOME: /data/state
    ports:
      - "<LAN_HOST>:8787:8787"
    volumes:
      - ./workspace:/data/workspace
      - hanse-state:/data/state

volumes:
  hanse-state:
